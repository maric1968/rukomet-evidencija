<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#17212b;--muted:#66717d;--line:#d8dee5;--soft:#f4f6f8;--yellow:#fff3b0;--red:#fde2df;--green:#e3f6e9;--orange:#ffead1;--orangeLine:#e79520}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:#111}
button,select,input{font:inherit} button{cursor:pointer}
.app{height:100dvh;max-width:1700px;margin:auto;padding:4px;display:flex;flex-direction:column;gap:4px}
.top{flex:0 0 auto}
.scorebar{height:66px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;align-items:center;gap:8px}
.teamTop{display:flex;align-items:center;gap:8px;min-width:0;justify-content:flex-end}.teamTop.right{justify-content:flex-start}
.tname{font-size:22px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px;color:#111;margin:0 6px}
.score{font-size:39px;font-weight:950;line-height:1;white-space:nowrap}
.topcontrols{display:flex;gap:4px;align-items:center;justify-content:flex-end;white-space:nowrap}
.clockbox,.breakbox{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 6px;text-align:center;min-width:82px}
.clocklabel{font-size:8px;color:var(--muted);font-weight:950;text-transform:uppercase}
.clocktime,.breaktime{font-size:23px;font-weight:950;font-variant-numeric:tabular-nums;line-height:1}
.clockbtn,.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 7px;font-weight:900;min-height:31px;font-size:10px}.clockbtn{padding-left:6px;padding-right:6px;min-width:36px}
.btn.active{background:#fff;color:#111}.stopClockBtn{border:2px solid #d92d20;background:#fff;color:#111;font-weight:950;min-width:50px}
.tabs{height:37px;display:flex;gap:4px;align-items:center}
.ttoHead{border:2px solid var(--team,#BFD8F6);border-radius:8px;padding:4px 7px;background:var(--ttoBg,#fff);color:var(--ttoText,#111);display:flex;gap:8px;align-items:center;white-space:nowrap;min-height:38px;margin:0 4px}
.ttoHead.warning{background:#ffe2df;border-color:#d92d20}

.ttoHeadRow b{color:var(--ttoText,#111);font-size:13px;font-weight:950}
.ttoHead.warning .ttoHeadRow:nth-child(2){background:#ffd0cc}

.screen{display:none;min-height:0}.screen.active{display:block}
#match.screen.active{flex:1;min-height:0}
#setup.screen.active,#log.screen.active{flex:1;min-height:0;overflow:auto;padding-bottom:10px}
.matchWrap{height:100%;display:grid;grid-template-rows:minmax(0,1fr) 220px;gap:4px}
.teamsGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;min-height:0}
.teamPane{--team:#1769d2;--teamSoft:rgba(23,105,210,.06);background:#fff;border:1px solid var(--team);border-radius:10px;min-height:0;overflow:hidden;display:grid;grid-template-rows:30px 142px minmax(0,1fr)}
.teamBar{background:var(--headBg,#f4f6f8);color:#111;font-size:17px;font-weight:950;text-align:center;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--team)}
.summaryGrid{display:grid;grid-template-columns:1.04fr 1.28fr 1.02fr 1.06fr;gap:4px;padding:4px;min-height:0}
.summaryBox{border:1px solid #d7dce2;border-radius:8px;padding:4px;background:#fff;min-width:0;overflow:hidden}
.summaryTitle{font-size:8px;font-weight:500;color:#111;text-transform:uppercase;text-align:center;margin-bottom:3px}
.officials{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.official{min-width:38px;height:31px;border:1px solid var(--team);color:var(--team);background:#fff;border-radius:6px;font-weight:950;font-size:12px;padding:0 6px}
.official.pen{background:var(--teamSoft)}

.officialGrid{display:grid;grid-template-columns:21px repeat(var(--officialCount,1),minmax(0,1fr));gap:2px;align-items:center;width:100%}
.officialLabel{font-size:8px;font-weight:500;color:#111;text-align:right;padding-right:1px}
.officialCell{min-width:0;min-height:21px;border:1px solid #d8dee5;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:950;color:#111;background:#fff;white-space:nowrap;overflow:hidden;padding:0 2px}
.officialHead{border:1px solid var(--team);background:#fff;color:#111;font-size:12px;min-height:22px}
.officialPenalty{font-weight:500!important;padding:0 1px!important;overflow:visible!important}
.officialPenalty.yellow{background:#FFF9DD}
.officialPenalty.two{background:#FFF0DE}
.officialPenalty.dq{background:#FCE8E6}
.officialPenalty span{display:block;color:#111!important;font-size:10px;font-weight:500;line-height:1;letter-spacing:-.02em}
.sevenCount{text-align:center;font-size:22px;font-weight:950;margin:1px 0 5px;color:#111}
.sevenhistory{display:flex;gap:4px;flex-wrap:wrap;align-content:flex-start}
.sevenchip{border-radius:5px;padding:3px 6px;font-size:10px;font-weight:950;white-space:nowrap;border:1px solid transparent}
.sevenchip.ok{background:#e4f5df;color:#111;border-color:#acd49f}.sevenchip.miss{background:#fde5e1;color:#111;border-color:#f4aaa1}
.injuryRows{display:flex;flex-direction:column;gap:7px}.injuryline{display:grid;grid-template-columns:34px 1fr auto;gap:5px;align-items:center}
.injuryplayer{font-size:14px;font-weight:950;color:#111}.attackdots{display:flex;gap:4px}
.attackdot{width:19px;height:19px;border:1px solid #9aa8b6;border-radius:50%;background:#fff}.attackdot.done{background:var(--team);border-color:var(--team)}
.attackbtn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 6px;font-weight:950;font-size:9px}
.attackbtn.injuryadd{color:#111;background:var(--team);border-color:var(--team)}.injuryready{font-size:10px;font-weight:950;color:#16733b}
.reductionMain{text-align:center}.reductionMax{font-size:22px;font-weight:950;margin:2px 0 5px;color:#111}
.reductionLabel{font-size:8px;color:#111;font-weight:500;text-transform:uppercase}
.returnrows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;margin-top:4px;max-height:84px;overflow:visible}.returnrow{display:grid;grid-template-columns:auto 1fr;gap:4px;align-items:center;font-size:9px;border:1px solid #d92d20;border-radius:4px;padding:2px 4px;background:#fde2df;color:#111;font-weight:950;min-width:0}
.returntime{font-size:11px;font-weight:950;color:#111;text-align:right;white-space:nowrap}.returnrow.anonymous,.returnrow.orange{background:#fde2df;border-color:#d92d20}.noActive{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}

.playerTableWrap{min-height:0;padding:0 5px 5px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.playerTable{width:100%;height:100%;border-collapse:collapse;table-layout:fixed}
.playerTable th,.playerTable td{border:1px solid #e1e6eb;text-align:center;padding:1px 2px;font-size:11px;height:42px;white-space:nowrap;color:#111}
.playerTable thead th{background:var(--headBg,#f4f6f8);color:#111;font-weight:950;border:1px solid #b8c2cc!important}.playerTable thead tr:first-child th{height:20px}.playerTable thead th+th{border-left:1px solid #b8c2cc!important}.playerTable thead tr+tr th{border-top:1px solid #b8c2cc!important}
.playerTable .no{width:82px}.playerTable .y{width:34px}.playerTable .dq{width:64px}.playerTable .g{width:38px}
.playerTable tbody tr:nth-child(odd){background:var(--teamSoft);color:#111}
.pno{display:inline-flex;align-items:center;justify-content:center;min-width:62px;height:40px;padding:0 7px;background:#fff;color:#111;border:3px solid var(--team);border-radius:8px;font-weight:950;font-size:34px!important;line-height:1;letter-spacing:-.03em;box-shadow:0 1px 2px rgba(0,0,0,.10)}
.playerTable tbody tr.activeSusp .pno{display:inline-flex;align-items:center;justify-content:center;min-width:62px;height:40px;padding:0 7px;background:#fff;color:#111;border:3px solid var(--team);border-radius:8px;font-weight:950;font-size:34px!important;line-height:1;letter-spacing:-.03em;box-shadow:0 0 0 4px rgba(217,45,32,.34);outline:4px solid #d92d20;outline-offset:2px}
.playerTable tbody tr.dqrow{background:#fde6e3}

@keyframes pulseNo{0%,100%{transform:scale(1);box-shadow:0 0 0 2px rgba(217,45,32,.18)}50%{transform:scale(1.08);box-shadow:0 0 0 5px rgba(217,45,32,.38)}}50%{box-shadow:0 0 0 4px rgba(255,176,0,.45)}}
.bigHead{font-size:18px!important;font-weight:950!important}.statY{font-weight:900;font-size:12px;color:#111}.statG{font-weight:950;font-size:16px;color:#111}.suspTime{font-variant-numeric:tabular-nums;font-weight:950;font-size:16px;color:#111}.dqTime{font-variant-numeric:tabular-nums;font-weight:950;font-size:16px;color:#111}

.progressBox{background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 5px;min-height:0;overflow:hidden}
.progressTitle{font-size:11px;font-weight:950;margin:0 0 3px 2px}
.progressStrip{display:grid;grid-template-columns:42px 1fr;gap:3px;margin-bottom:5px}
.progressLabels{display:grid;grid-template-rows:repeat(4,1fr);gap:1px}
.progressLabels div{display:flex;align-items:center;justify-content:center;border-radius:4px;color:#111;font-size:10px;font-weight:950;min-height:20px;background:#fff;border:1px solid #d8dee5}
.progressLabels .a{background:#fff;color:#111;border:1px solid #d8dee5}.progressLabels .b{background:#fff;color:#111;border:1px solid #d8dee5}.progressLabels .m,.progressLabels .p{background:#fff;color:#111;border:1px solid #d8dee5}
.progressCols{display:grid;grid-template-columns:repeat(40,minmax(0,1fr));gap:1px;min-width:0}
.goalCol{display:grid;grid-template-rows:repeat(4,1fr);gap:1px;min-width:0}
.goalCell{min-height:20px;border:1px solid #e2e6ea;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;overflow:hidden;white-space:nowrap;color:#111;background:#fff}
.goalCell.team{font-size:11px;font-weight:950}.progressEmpty{font-size:10px;color:var(--muted);padding:8px}
.progressOverflow{font-size:10px;font-weight:950;color:#b42318;margin-left:45px}


.setupHeader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.setupHeader h2{margin:0;font-size:22px}
.setupDone{border:0;border-radius:10px;background:#fff;color:#111;font-weight:950;font-size:15px;padding:11px 18px;min-height:44px}
.setupgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.setupTeamCard{background:#fff;border:2px solid var(--setupTeam,#1769d2);border-radius:12px;padding:10px}
.setupTeamTitle{font-size:20px;font-weight:950;color:#111;margin-bottom:7px}
.setupMetrics{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.setupMetric{border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:950;background:#f7f8fa}
.setupName{width:100%;min-height:46px;border:2px solid var(--line);border-radius:9px;padding:0 10px;font-size:17px;font-weight:900;color:#111;background:#fff}
.setupPlayers{display:grid;grid-template-columns:310px 1fr;gap:10px;align-items:start}
.setupKeypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.setupKey{min-height:54px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:22px;font-weight:950;color:#111}
.setupDisplay{font-size:32px;font-weight:950;background:#f4f6f8;border:2px solid var(--line);border-radius:9px;padding:6px 8px;text-align:center;margin-bottom:6px;color:#111}
.setupRoster{display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;min-height:120px}
.setupPlayerTag{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--setupTeam,#1769d2);border-radius:8px;padding:4px 6px;background:#fff;color:#111;font-size:20px;font-weight:950}
.setupPlayerTag button{border:0;background:transparent;color:#b42318;font-size:18px;font-weight:950;padding:0 2px}
.setupOfficials{display:grid;grid-template-columns:repeat(6,minmax(48px,1fr));gap:5px;width:100%}
.setupOfficial{min-height:38px;border:2px solid var(--line);border-radius:7px;background:#fff;color:#111;font-size:16px;font-weight:950;padding:0}
.setupOfficial.on{border-color:var(--setupTeam,#1769d2);background:var(--setupSoft,#eef6ff);color:#111}
.setupSection{font-size:11px;font-weight:950;color:#111;text-transform:uppercase;margin:10px 0 5px}
.setupColors{display:grid;grid-template-columns:repeat(10,34px);gap:7px}
.setupColor{width:34px;height:34px;border-radius:8px;border:3px solid #fff;box-shadow:0 0 0 1px #b9c1ca}
.setupColor.on{box-shadow:0 0 0 4px #17212b}
@media(max-width:1000px){
  .setupgrid{grid-template-columns:1fr}
  .setupPlayers{grid-template-columns:280px 1fr}
}

.setupgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:350px}.key{min-height:48px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:18px;font-weight:900}
.display{font-size:28px;font-weight:950;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px;margin-bottom:7px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.tag{border:1px solid var(--line);border-radius:999px;padding:5px 7px;font-weight:800}.tag button{border:0;background:transparent;color:#b42318;font-weight:900}
.offpick{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.offpick button{min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:900}.offpick .on{background:#fff;color:#111}
.sectiontitle{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 5px}.small{font-size:11px;color:var(--muted)}
.colorpick{display:grid;grid-template-columns:repeat(5,34px);gap:9px}.colorswatch{width:34px;height:34px;border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 1px var(--line)}.colorswatch.on{box-shadow:0 0 0 4px #17212b}
.log{display:flex;flex-direction:column;gap:5px}.logitem{border:1px solid var(--line);border-radius:8px;padding:7px;font-size:12px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.logactions{display:flex;gap:4px}.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 7px;font-weight:800}
.modalbg{display:none;position:fixed;inset:0;background:rgba(8,15,22,.28);z-index:100;align-items:flex-start;justify-content:flex-end;padding:68px 8px 8px}.modalbg.show{display:flex}
.modal{width:min(500px,calc(100vw - 16px));max-height:calc(100vh - 76px);overflow:auto;background:#fff;border-radius:12px;padding:10px;box-shadow:0 14px 45px rgba(0,0,0,.24)}
.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.modaltitle{font-size:18px;font-weight:950}.close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px}
.eventgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.eventbtn{min-height:58px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;font-weight:950}.eventbtn.goal{background:var(--green)}.eventbtn.warn{background:var(--yellow)}.eventbtn.dq{background:var(--red)}.eventbtn.double{background:var(--orange);border-color:var(--orangeLine)}
.timegrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.timebtn{min-height:56px;border:1px solid #cfd5dc;border-radius:10px;background:#fff;font-weight:700;font-size:28px;line-height:1;padding:4px 2px;color:#111}.timebtn.h1{background:#eef5ff}.timebtn.h2{background:#eefaf4}.timebtn .lead{font-size:1em;font-weight:600;color:#111}.timebtn .tail{font-size:1em;font-weight:700;color:#315f8f;margin-left:1px}.timebtn .single{font-size:1em;font-weight:650;color:#111}.timebtn:active{transform:scale(.99)}
.confirmbox{border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--soft);margin:6px 0}.footer{display:flex;gap:6px;margin-top:8px}.footer .btn{flex:1}
.manualgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:11px;font-weight:900;color:var(--muted);margin:0 0 3px}.field select,.field input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font:inherit;font-weight:800}.field.full{grid-column:1/-1}

.breakbox.running{border-color:#1769d2;background:#eef6ff}.breakbox.done{border-color:#d92d20;background:#fde2df}.breakHidden{display:none!important}
@media(max-height:800px){.matchWrap{grid-template-rows:minmax(0,1fr) 190px}.teamPane{grid-template-rows:28px 126px minmax(0,1fr)}.summaryGrid{height:126px}.playerTable th,.playerTable td{height:19px;font-size:9px}.goalCell,.progressLabels div{min-height:17px}}

<script>
const OFFICIALS=["A","B","C","D","E","F"];
const TEAM_COLOR_PRESETS=["#BFD8F6","#F6C2C2","#C7E6CF","#DEC9F2","#F8D4AE","#111827","#F4C8DE","#BFE4E5","#F2DEA0","#D4DEE5","#8B1E1E","#123A6D","#1F5D3A","#5B2C6F","#9A5B13","#374151"];
const DEFAULT_TEAMS=["RK Dinamo","RK Dubočica 54","Ekipa A","Ekipa B"];
const STORAGE_KEY="rukomet-touch-v6";
function load(){
  try{
    const raw=window.localStorage?localStorage.getItem(STORAGE_KEY):null;
    return raw?JSON.parse(raw):null;
  }catch(e){ return null; }
}
let state=load()||{
  teamNames:["RK Dinamo","RK Dubočica 54"],
  players:[[],[]],
  officials:[[],[]],
  events:[]
};
let buf=["",""], pending=null;
let editingEventId=null;
let selectedEventIds=new Set();
function normalizeState(){
  if(!state||typeof state!=="object") state={};
  if(!Array.isArray(state.teamNames)) state.teamNames=["RK Dinamo","RK Dubočica 54"];
  state.teamNames=[state.teamNames[0]||"RK Dinamo",state.teamNames[1]||"RK Dubočica 54"];

  if(!Array.isArray(state.players)) state.players=[[],[]];
  state.players=[Array.isArray(state.players[0])?state.players[0]:[],Array.isArray(state.players[1])?state.players[1]:[]];

  if(!Array.isArray(state.officials)) state.officials=[[],[]];
  state.officials=[Array.isArray(state.officials[0])?state.officials[0]:[],Array.isArray(state.officials[1])?state.officials[1]:[]];

  if(!Array.isArray(state.teamColors)) state.teamColors=["#0B63CE","#D92D20"];
  state.teamColors=[state.teamColors[0]||"#0B63CE",state.teamColors[1]||"#D92D20"];

  if(typeof state.viewSwapped!=="boolean")state.viewSwapped=false;
    if(!Array.isArray(state.events)) state.events=[];
  state.events=state.events.map((e,i)=>({...e,id:e.id??(Date.now()+i+Math.random()),seq:e.seq??i,attacksDone:e.type==="injury3"?Math.max(0,Math.min(3,Number(e.attacksDone||0))):e.attacksDone,injuryClosed:e.type==="injury3"?Boolean(e.injuryClosed):e.injuryClosed}));

}

normalizeState();


let suppressedReductionIds=new Set();
let lastLiveReductionSignature="";

function cleanupSuppressedReductions(now){
  const current=Number(now||0);
  const validIds=new Set();

  [0,1].forEach(t=>{
    reductionSlotsForTeam(t).forEach(s=>{
      if(current<Number(s.end||0))validIds.add(String(s.id));
    });
  });

  suppressedReductionIds=new Set(
    [...suppressedReductionIds].filter(id=>validIds.has(String(id)))
  );
}

function reductionsCrossedByBackwardClock(oldSeconds,newSeconds){
  const oldT=Number(oldSeconds||0);
  const newT=Number(newSeconds||0);
  if(newT>=oldT)return [];

  const crossed=[];
  [0,1].forEach(t=>{
    reductionSlotsForTeam(t).forEach(s=>{
      const end=Number(s.end||0);
      const start=Number(s.start||0);
      if(oldT>=end && newT<end && newT>=start){
        crossed.push({...s,team:t});
      }
    });
  });

  return crossed;
}

function reductionShortLabel(slot){
  const e=slot.event||{};
  if(slot.additionalTeamReduction)return `${state.teamNames[slot.team]} · dodatna redukcija`;
  if(slot.additionalOffender)return `${state.teamNames[slot.team]} · #${e.actor} ADD`;
  if(e.actorType==="official")return `${state.teamNames[slot.team]} · Zv.${e.actor}`;
  return `${state.teamNames[slot.team]} · #${e.actor??"—"}`;
}

function applyClockChangeWithReductionCheck(newSeconds,source,running){
  const oldSeconds=refClockState.active?Math.floor(currentRefSeconds()):0;
  const next=clampGameSeconds(newSeconds);
  const crossed=reductionsCrossedByBackwardClock(oldSeconds,next);

  if(crossed.length){
    const text=crossed
      .slice(0,4)
      .map(s=>`${reductionShortLabel(s)} · povratak ${secondsToClock(Number(s.end||0))}`)
      .join("\n");

    const reactivate=confirm(
      `Vreme je vraćeno unazad preko isteka ${crossed.length===1?"isključenja":"isključenja"}:\n\n${text}`+
      `${crossed.length>4?`\n+ još ${crossed.length-4}`:""}`+
      `\n\nPonovo aktivirati ${crossed.length===1?"ovo isključenje":"ova isključenja"}?`
    );

    crossed.forEach(s=>{
      const id=String(s.id);
      if(reactivate)suppressedReductionIds.delete(id);
      else suppressedReductionIds.add(id);
    });
  }

  setReferenceClock(next,source,running);
  cleanupSuppressedReductions(next);
  refreshLiveReductionUI(true);
}

let refClockState={
  active:false,
  running:false,
  baseSeconds:0,
  baseRealMs:Date.now(),
  source:""
};

function clampGameSeconds(v){
  return Math.max(0,Math.min(3600,Math.round(Number(v)||0)));
}
function currentRefSeconds(){
  if(!refClockState.active) return null;
  if(!refClockState.running) return refClockState.baseSeconds;
  return clampGameSeconds(refClockState.baseSeconds+(Date.now()-refClockState.baseRealMs)/1000);
}
function setReferenceClock(seconds,source,running=true){
  refClockState.active=true;
  refClockState.running=running;
  refClockState.baseSeconds=clampGameSeconds(seconds);
  refClockState.baseRealMs=Date.now();
  refClockState.source=source||"korekcija";
  renderReferenceClock();
}
function resumeReferenceClock(){
  if(!refClockState.active){
    setReferenceClock(0,"ručni START",true);
    return;
  }
  if(refClockState.running)return;
  refClockState.baseRealMs=Date.now();
  refClockState.running=true;
  refClockState.source="ručni START";
  renderReferenceClock();
}
function adjustReferenceClock(delta){
  const cur=refClockState.active?Math.floor(currentRefSeconds()):0;
  const next=cur+Number(delta||0);
  applyClockChangeWithReductionCheck(
    next,
    "korekcija "+(delta>0?"+":"")+delta+" s",
    refClockState.running
  );
}
function pauseReferenceClock(source){
  if(!refClockState.active)return;
  refClockState.baseSeconds=clampGameSeconds(currentRefSeconds());
  refClockState.baseRealMs=Date.now();
  refClockState.running=false;
  refClockState.source=source||"pauzirano";
  renderReferenceClock();
}
function startReferenceHalf(half){
  if(Number(half)===1){
    setReferenceClock(0,"početak 1. poluvremena",false);
  }else{
    breakTimerState.active=false;
    breakTimerState.secondHalfReset=true;
    breakTimerState.finished=false;
    breakTimerState.durationSeconds=0;
    breakTimerState.endRealMs=0;
    setReferenceClock(30*60,"početak 2. poluvremena",false);
    renderBreakTimer();
  }
}
function updateBreakVisibility(){
  // Vreme pauze uvek ostaje vidljivo.
  // Početkom drugog poluvremena samo se resetuje na 00:00.
  ["breakBox","break10","break15"].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.remove("breakHidden");
  });
}
function renderReferenceClock(){
  updateBreakVisibility();
  const c=document.getElementById("refClock");
  if(!c)return;
  if(!refClockState.active){
    c.textContent="--:--";
    renderHalftimeScore();
    return;
  }
  c.textContent=secondsToClock(Math.floor(currentRefSeconds()));
  renderHalftimeScore();
}
function resetHalftimeTimerIfSecondHalfEvent(e){
  if(!e)return;

  if(isSecondHalfEvent(e)){
    breakTimerState.active=false;
    breakTimerState.secondHalfReset=true;
    breakTimerState.finished=false;
    breakTimerState.durationSeconds=0;
    breakTimerState.endRealMs=0;

    const box=document.getElementById("breakBox");
    const c=document.getElementById("breakClock");
    if(box)box.classList.remove("running","done");
    if(c)c.textContent="00:00";
  }
}
function syncReferenceClockFromEvent(e){
  if(!e||e.minute==null)return;

  resetHalftimeTimerIfSecondHalfEvent(e);
  renderBreakTimer();

  const exact=["2min","2plus2","additional","dq","tto"].includes(e.type) && e.second!=null;

  // GOL, Ž i 7 m se čuvaju kao minut događaja.
  // Taj minut je evidencija, a NE nova vrednost sata.
  if(!exact)return;

  setReferenceClock(
    timeToSeconds(e.minute,e.second),
    label(e.type)+" "+formatTime(e),
    refClockState.running
  );
}
function openClockCorrection(){
  const cur=refClockState.active?Math.floor(currentRefSeconds()):0;
  const m=Math.floor(cur/60),s=cur%60;
  openModal(`<div class="modalhead"><div class="modaltitle">Koriguj orijentacioni sat</div><button class="close" onclick="closeModal()">×</button></div>
    <div class="manualgrid">
      <div class="field"><label>Minut</label><input id="clockMinute" type="number" inputmode="numeric" min="0" max="60" value="${m}"></div>
      <div class="field"><label>Sekunde</label><input id="clockSecond" type="number" inputmode="numeric" min="0" max="59" value="${s}"></div>
    </div>
    
    <div class="footer"><button class="btn" onclick="closeModal()">Odustani</button><button class="btn" style="background:#1f6feb;color:#fff" onclick="saveClockCorrection()">KORIGUJ</button></div>`);
}
function saveClockCorrection(){
  const m=Number(document.getElementById("clockMinute").value);
  const s=Number(document.getElementById("clockSecond").value);

  if(!Number.isInteger(m)||m<0||m>60||!Number.isInteger(s)||s<0||s>59){
    alert("Unesi ispravno vreme.");
    return;
  }

  const next=m*60+s;
  applyClockChangeWithReductionCheck(
    next,
    "ručna korekcija "+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"),
    true
  );
  closeModal();
}

let breakTimerState={
  active:false,
  secondHalfReset:false,
  durationSeconds:0,
  endRealMs:0,
  finished:false
};
function startBreakTimer(minutes){
  pauseReferenceClock("pauza između poluvremena");
  breakTimerState.secondHalfReset=false;
  breakTimerState.active=true;
  breakTimerState.finished=false;
  breakTimerState.durationSeconds=Number(minutes)*60;
  breakTimerState.endRealMs=Date.now()+breakTimerState.durationSeconds*1000;
  renderBreakTimer();
}
function resetBreakTimer(){
  breakTimerState.active=false;
  breakTimerState.finished=false;
  breakTimerState.durationSeconds=0;
  breakTimerState.endRealMs=0;
  renderBreakTimer();
}
function remainingBreakSeconds(){
  if(!breakTimerState.active)return null;
  return Math.max(0,Math.ceil((breakTimerState.endRealMs-Date.now())/1000));
}
function playBreakBeep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=880;gain.gain.value=0.08;
    osc.start();osc.stop(ctx.currentTime+0.35);
    osc.onended=()=>ctx.close();
  }catch(e){}
}
function renderBreakTimer(){
  const box=document.getElementById("breakBox"),c=document.getElementById("breakClock");
  if(!box||!c)return;
  box.classList.remove("running","done");
  if(!breakTimerState.active){
    c.textContent=breakTimerState.secondHalfReset?"00:00":"--:--";
    return;
  }
  const rem=remainingBreakSeconds();
  c.textContent=String(Math.floor(rem/60)).padStart(2,"0")+":"+String(rem%60).padStart(2,"0");
  if(rem>0){
    box.classList.add("running");
  }else{
    box.classList.add("done");c.textContent="00:00";
    if(!breakTimerState.finished){breakTimerState.finished=true;playBreakBeep();}
  }
}
function liveReductionSignature(){
  const now=currentGameSecond();
  const parts=[String(now>=30*60)];

  [0,1].forEach(t=>{
    activeReductionSlots(t).forEach(s=>{
      const remaining=Math.max(0,Math.ceil(Number(s.end||0)-now));
      parts.push([
        t,
        String(s.id),
        Math.floor(Number(s.end||0)),
        remaining>0&&remaining<=10?"blink":"normal"
      ].join(":"));
    });
  });

  return parts.join("|");
}

function refreshLiveReductionUI(force=false){
  const sig=liveReductionSignature();
  if(!force && sig===lastLiveReductionSignature)return;

  lastLiveReductionSignature=sig;
  renderTeam(0);
  renderTeam(1);
  renderMiddleStatus();
}

setInterval(()=>{
  renderReferenceClock();
  renderBreakTimer();
  refreshLiveReductionUI(false);
},500);

function save(){
  try{ if(window.localStorage) localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }catch(e){}
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function showScreen(id,b){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".tabs .btn").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active")}
function openModal(h){document.getElementById("modal").innerHTML=h;document.getElementById("modalbg").classList.add("show")}
function closeModal(){document.getElementById("modalbg").classList.remove("show")}

function chronologicalEvents(){
  return [...state.events].sort((a,b)=>
    (eventClockSeconds(a)-eventClockSeconds(b)) ||
    (Number(a.seq||0)-Number(b.seq||0))
  );
}
function teamScore(t){return state.events.filter(e=>e.team===t&&(e.type==="goal"||(e.type==="7m"&&e.result==="goal"))).length}
function suspensionUnits(e){return e.type==="2plus2"?2:(["2min","additional"].includes(e.type)?1:0)}
function playerSuspensionCount(t,n,excludeId=null){
  return state.events.filter(e=>e.team===t&&e.actorType==="player"&&String(e.actor)===String(n)&&String(e.id)!==String(excludeId)).reduce((sum,e)=>sum+suspensionUnits(e),0);
}
function playerWarningMinute(t,n){
  const e=chronologicalEvents().find(e=>
    Number(e.team)===Number(t) &&
    e.actorType==="player" &&
    String(e.actor)===String(n) &&
    e.type==="warning"
  );
  return e ? String(e.minute) : "-";
}


function playerWarningAvailable(team,player,excludeId=null){
  const relevant=state.events.filter(e=>
    e.actorType==="player" &&
    e.type==="warning" &&
    Number(e.team)===Number(team) &&
    (excludeId==null || String(e.id)!==String(excludeId))
  );

  const playerAlready=relevant.some(e=>String(e.actor)===String(player));
  if(playerAlready)return false;

  return relevant.length<3;
}

function teamPlayerWarningCount(team,excludeId=null){
  return state.events.filter(e=>
    e.actorType==="player" &&
    e.type==="warning" &&
    Number(e.team)===Number(team) &&
    (excludeId==null || String(e.id)!==String(excludeId))
  ).length;
}


function playerSuspensionCountForLimit(team,player,excludeId=null){
  return state.events
    .filter(e=>
      e.actorType==="player" &&
      Number(e.team)===Number(team) &&
      String(e.actor)===String(player) &&
      (excludeId==null || String(e.id)!==String(excludeId))
    )
    .reduce((sum,e)=>sum+suspensionUnits(e),0);
}

function playerSuspensionAvailable(team,player,type,excludeId=null){
  if(!["2min","2plus2","additional"].includes(type))return true;

  const events=state.events.filter(e=>
    e.actorType==="player" &&
    Number(e.team)===Number(team) &&
    String(e.actor)===String(player) &&
    (excludeId==null || String(e.id)!==String(excludeId))
  );

  if(events.some(e=>e.type==="dq"))return false;

  const current=events.reduce((sum,e)=>sum+suspensionUnits(e),0);
  const add=type==="2plus2"?2:1;
  return current+add<=3;
}

function playerStats(t,n){
  const ev=state.events.filter(e=>
    Number(e.team)===Number(t) &&
    e.actorType==="player" &&
    String(e.actor)===String(n)
  );

  const m2=ev.reduce((sum,e)=>sum+suspensionUnits(e),0);
  const directDQEvent=ev.find(e=>e.type==="dq")||null;
  const directDQ=Boolean(directDQEvent);
  const thirdExclusionDQ=m2>=3;

  return {
    g:ev.filter(e=>e.type==="goal"||(e.type==="7m"&&e.result==="goal")).length,
    y:ev.filter(e=>e.type==="warning").length,
    sevenGoals:ev.filter(e=>e.type==="7m"&&e.result==="goal").length,
    m2,
    directDQ,
    directDQEvent,
    thirdExclusionDQ,
    dq:directDQ||thirdExclusionDQ,
    injury:currentInjuryForPlayer(t,n)
  };
}
function autoDQForEvent(e,excludeId=null){
  if(!e||e.actorType!=="player"||!["2min","2plus2","additional"].includes(e.type))return false;
  const excluded=excludeId??e.id??null;
  const before=playerSuspensionCount(e.team,e.actor,excluded);
  return before+suspensionUnits(e)>=3;
}
function timeToSeconds(minute,second){return Number(minute||0)*60+Number(second||0)}

function eventClockSeconds(e){
  if(!e)return 0;

  const stored=Number(e.clockSeconds);
  if(Number.isFinite(stored) && stored>=0)return stored;

  // Exact events keep real mm:ss.
  if(e.second!=null){
    return Math.max(0,timeToSeconds(e.minute,e.second));
  }

  // Legacy minute-only events: "30. minut" means an event somewhere in 29:00–29:59.
  // Use the final second of that minute so it can NEVER become an artificial 30:00.
  const shownMinute=Math.max(1,Number(e.minute)||1);
  return Math.max(0,shownMinute*60-1);
}

function isFirstHalfEvent(e){
  return eventClockSeconds(e)<30*60;
}

function isSecondHalfEvent(e){
  return eventClockSeconds(e)>=30*60;
}

function secondsToClock(total){
  if(total>3600)return ">60:00";
  return `${String(Math.floor(total/60)).padStart(2,"0")}:${String(total%60).padStart(2,"0")}`;
}
function reductionEnd(e){
  const duration=e.type==="2plus2"?240:120;
  return eventClockSeconds(e)+duration;
}
function eventStartSeconds(e){
  return eventClockSeconds(e);
}

function reductionSlotsForTeam(t){
  const slots=[];

  chronologicalEvents().filter(e=>Number(e.team)===Number(t)).forEach(e=>{
    const start=eventStartSeconds(e);

    if(e.actorType==="player"&&e.type==="additional"){
      const end=start+120;

      // 1) Igrač koji je napravio prekršaj dobija svoje 2 min.
      slots.push({
        id:String(e.id)+":offender",
        event:e,
        start,
        end,
        kind:"additional",
        anonymous:false,
        additionalOffender:true,
        autoDQ:autoDQForEvent(e)
      });

      // 2) Ekipa se dodatno redukuje za još jednog igrača tokom istih 2 min.
      // Ovo je timska redukcija, ne nova lična kazna nedužnom igraču u statistici.
      slots.push({
        id:String(e.id)+":team",
        event:e,
        start,
        end,
        kind:"additionalTeamReduction",
        anonymous:true,
        additionalTeamReduction:true,
        autoDQ:false
      });

      return;
    }

    let duration=null,kind="";
    if(e.actorType==="player"&&["2min","2plus2"].includes(e.type)){
      duration=e.type==="2plus2"?240:120;
      kind=e.type;
    }else if(e.actorType==="player"&&e.type==="dq"){
      duration=120;
      kind="dq";
    }else if(e.actorType==="official"&&["2min","dq"].includes(e.type)){
      duration=120;
      kind="official";
    }

    if(duration===null)return;

    let anonymous=false;
    if(e.actorType==="player"&&["2min","2plus2"].includes(e.type)){
      anonymous=state.events.some(x=>
        Number(x.team)===Number(t) &&
        x.actorType==="player" &&
        String(x.actor)===String(e.actor) &&
        x.earlyEntry===true &&
        eventStartSeconds(x)>start &&
        eventStartSeconds(x)<start+duration
      );
    }

    slots.push({
      id:String(e.id),
      event:e,
      start,
      end:start+duration,
      kind,
      anonymous,
      autoDQ:autoDQForEvent(e)
    });
  });

  return slots;
}
function currentGameSecond(){
  const refNow=currentRefSeconds();
  if(refNow!=null)return Math.floor(refNow);
  return chronologicalEvents().reduce((m,e)=>Math.max(m,eventClockSeconds(e)),0);
}

}

}
function hasLaterEarlyEntryDuring(e){

  const start=eventStartSeconds(e),end=reductionEnd(e);

}
function slotLabel(slot){

  if(e.type==="dq")return "BEZ BROJA";

function returnRows(t){

}

function officialsForDisplay(t){
  if(!Array.isArray(state.officials))state.officials=[[],[]];

  if(!Array.isArray(state.events))state.events=[];

  // Zadrži samo važeća slova iz POSTAVKE.
  let selected=[...new Set(state.officials[t].map(String))]
    .filter(o=>OFFICIALS.includes(o))
    .sort((a,b)=>OFFICIALS.indexOf(a)-OFFICIALS.indexOf(b))

  // Ako postoji stvarno evidentirana kazna za zvaničnika koji je nestao iz
  // postavke tokom prethodnih verzija, vrati tog zvaničnika u prikaz.
  const withPenalty=[...new Set(state.events
    .filter(e=>Number(e.team)===t && e.actorType==="official" &&
      ["warning","2min","dq"].includes(e.type) &&
      OFFICIALS.includes(String(e.actor)))
    .map(e=>String(e.actor)))]
    .sort((a,b)=>OFFICIALS.indexOf(a)-OFFICIALS.indexOf(b));

  for(const o of withPenalty){
    if(!selected.includes(o) && selected.length<5)selected.push(o);
  }

  selected=selected
    .sort((a,b)=>OFFICIALS.indexOf(a)-OFFICIALS.indexOf(b))
    .slice(0,5);

function hexToRgba(hex,alpha=0.08){
  let h=String(hex||"").replace("#","");
  if(h.length===3)h=h.split("").map(x=>x+x).join("");
  if(!/^[0-9a-fA-F]{6}$/.test(h))return `rgba(11,99,206,${alpha})`;
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function setTeamColor(t,color){

function normalizeHexColor(color){
  let h=String(color||"").trim().replace("#","");
  if(h.length===3)h=h.split("").map(x=>x+x).join("");
  return /^[0-9a-fA-F]{6}$/.test(h)?"#"+h.toUpperCase():null;
}
function relativeLuminance(color){
  const h=normalizeHexColor(color);
  if(!h)return 1;
  const rgb=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2];
}
function contrastTextColor(color){
  return relativeLuminance(color)<0.38?"#FFFFFF":"#111111";
}
function isDarkTeamColor(color){
  return relativeLuminance(color)<0.38;
}

function isRedEquipmentColor(color){
  const h=normalizeHexColor(color);
  if(!h)return false;

  const r=parseInt(h.slice(1,3),16);
  const g=parseInt(h.slice(3,5),16);
  const b=parseInt(h.slice(5,7),16);

  // dovoljno široko da obuhvati svetlu i tamnocrvenu iz palete,
  // ali da ne proglasi narandžastu/braon za crvenu opremu
  return r>=110 && r>g*1.45 && r>b*1.35 && g<125;
}


function isBlackTeamColor(c){

}

function renderTTOHead(t){

  const rows=[0,1,2].map(i=>{
    const e=ev[i];

    if(e){
      return `<div class="ttoHeadRow"><b>T${i+1}</b><span>${String(e.minute).padStart(2,"0")}:${String(e.second??0).padStart(2,"0")}</span></div>`;

    if(lastFive && usedLastFive){
      return `<div class="ttoHeadRow ttoLocked"><b>T${i+1}</b><span>×</span></div>`;
    }

    if(limited && i===ev.length){
      return `<div class="ttoHeadRow ttoLast"><b>T${i+1}</b><span>JOŠ 1</span></div>`;
    }

    if(limited && i>ev.length){

    }

    return `<div class="ttoHeadRow"><b>T${i+1}</b><span>-</span></div>`;

  return `<button class="ttoHead ${lastFive?"lastFiveWarning":""}" style="--team:${state.teamColors[t]};--ttoBg:#fff;--ttoText:#111" onclick="startTTO(${t})">${rows}</button>`;

function playerSuspensionTimes(t,n){
  const times=[];
  chronologicalEvents().filter(e=>e.team===t&&e.actorType==="player"&&String(e.actor)===String(n)&&["2min","2plus2","additional"].includes(e.type)).forEach(e=>{
    const stamp=`${String(e.minute).padStart(2,"0")}:${String(e.second??0).padStart(2,"0")}`;
    for(let i=0;i<suspensionUnits(e);i++)times.push(stamp);
  });
  return times.slice(0,3);
}
function playerDQTime(t,n){
  const events=chronologicalEvents().filter(e=>e.team===t&&e.actorType==="player"&&String(e.actor)===String(n));
  const direct=events.find(e=>e.type==="dq");
  if(direct)return `${String(direct.minute).padStart(2,"0")}:${String(direct.second??0).padStart(2,"0")}`;
  let count=0;
  for(const e of events.filter(e=>["2min","2plus2","additional"].includes(e.type))){
    count+=suspensionUnits(e);
    if(count>=3)return `${String(e.minute).padStart(2,"0")}:${String(e.second??0).padStart(2,"0")}`;
  }
  return "";
}

function playerDisqualifiedAt(team,player,atSeconds,excludeId=null){
  const ev=chronologicalEvents().filter(e=>
    Number(e.team)===Number(team) &&
    e.actorType==="player" &&
    String(e.actor)===String(player) &&
    (excludeId==null || String(e.id)!==String(excludeId)) &&
    eventStartSeconds(e)<=Number(atSeconds)
  );

  if(ev.some(e=>e.type==="dq"))return true;

  const suspensionCount=ev.reduce((sum,e)=>sum+suspensionUnits(e),0);
  return suspensionCount>=3;
}

function playerUnavailableForPlayAt(team,player,atSeconds,excludeId=null){
  const at=Number(atSeconds)||0;

  if(playerDisqualifiedAt(team,player,at,excludeId))return true;

  return chronologicalEvents().some(e=>
    Number(e.team)===Number(team) &&
    e.actorType==="player" &&
    String(e.actor)===String(player) &&
    ["2min","2plus2","additional"].includes(e.type) &&
    (excludeId==null || String(e.id)!==String(excludeId)) &&
    eventStartSeconds(e)<=at &&
    reductionEnd(e)>at
  );
}

  const directDQ=ev.find(e=>e.type==="dq")||null;
  const injury=currentInjuryForPlayer(t,n);

  );

  let dqText="—";

function compactEventTime(e){
  if(!e||e.minute==null)return "--";
  return e.second==null?String(e.minute):`${String(e.minute).padStart(2,"0")}:${String(e.second).padStart(2,"0")}`;
}



let comboPending=null;

function comboMinuteFromSeconds(sec){
  sec=Math.max(0,Math.min(60*60,Math.floor(Number(sec)||0)));
  if(sec===30*60)return 30;
  if(sec===60*60)return 60;
  return Math.min(60,Math.floor(sec/60)+1);
}

function startCombo(type){

  comboPending.type=type;

  comboPending.second=null;

function comboParts(){
  const map={
    warning_7m:["warning","7m"],
    warning_goal:["warning","goal"],
    "2min_7m":["2min","7m"],
    dq_7m:["dq","7m"],
    goal_2min:["goal","2min"],
    goal_dq:["goal","dq"]
  };
  return map[comboPending.type]||[];
}

function comboTypeLabel(type){
  return type==="warning"?"ŽUTI":type==="2min"?"2 MIN":type==="dq"?"DQ":type==="7m"?"7 m":"GOL";
}

function chooseComboFirstActor(){
  const [type]=comboParts();
  chooseComboPlayerForPart(1,type);
}

function chooseComboSecondActor(){
  const parts=comboParts();
  chooseComboPlayerForPart(2,parts[1]);
}

function chooseComboPlayerForPart(partNo,type){
  const at=Number(comboPending?.capturedSeconds||0);
  const needsPlayable=["goal","7m"].includes(type);

  const eligible=(team)=>[...(state.players[team]||[])]
    .sort((a,b)=>a-b)
    .filter(n=>!needsPlayable || !playerUnavailableForPlayAt(team,n,at));

  const rosterA=eligible(0);
  const rosterB=eligible(1);

  const grid=(team,roster,pno)=>roster.length
    ?roster.map(n=>`<button class="playerPickBtn" style="--team:${state.teamColors[team]}" onclick="setComboActor(${pno},${team},${n})">${n}</button>`).join("")
    :'<div class="noPlayable">NEMA DOSTUPNIH IGRAČA</div>';

  if(partNo===2 && comboPending && comboPending.first){
    const firstTeam=Number(comboPending.first.team);
    const opponent=firstTeam===0?1:0;
    const roster=opponent===0?rosterA:rosterB;

    openModal(`<div class="modalhead"><div class="modaltitle">KOMBO · ${comboTypeLabel(type)} · ${esc(state.teamNames[opponent])} · izaberi igrača</div><button class="close" onclick="closeModal()">×</button></div>
      <div class="pickTeams comboOpponentOnly">
        <div class="pickTeamBox" style="--pick:${state.teamColors[opponent]}">
          <div class="pickTeamTitle">${opponent===0?"A":"B"} · ${esc(state.teamNames[opponent])}</div>
          <div class="playerPickGrid">${grid(opponent,roster,2)}</div>
        </div>
      </div>`);
    return;
  }

  openModal(`<div class="modalhead"><div class="modaltitle">KOMBO · ${comboTypeLabel(type)} · izaberi igrača</div><button class="close" onclick="closeModal()">×</button></div>
    <div class="pickTeams">
      <div class="pickTeamBox" style="--pick:${state.teamColors[0]}">
        <div class="pickTeamTitle">A · ${esc(state.teamNames[0])}</div>
        <div class="playerPickGrid">${grid(0,rosterA,partNo)}</div>
      </div>
      <div class="pickTeamBox" style="--pick:${state.teamColors[1]}">
        <div class="pickTeamTitle">B · ${esc(state.teamNames[1])}</div>
        <div class="playerPickGrid">${grid(1,rosterB,partNo)}</div>
      </div>
    </div>`);
}

function setComboActor(partNo,team,actor){
  const type=comboParts()[partNo-1];
  comboPending[partNo===1?"first":"second"]={type,team:Number(team),actor:Number(actor)};

  if(type==="7m"){
    chooseCombo7mResult(partNo);
    return;
  }

  if(partNo===1){
    chooseComboSecondActor();
  }else{
    saveComboEvents();
  }
}

function chooseCombo7mResult(partNo){
  const part=comboPending[partNo===1?"first":"second"];
  openModal(`<div class="modalhead"><div class="modaltitle">KOMBO · 7 m · #${part.actor}</div><button class="close" onclick="closeModal()">×</button></div>
    <div class="eventgrid">
      <button class="eventbtn goal" onclick="setCombo7mResult(${partNo},'goal')">POGODAK</button>
      <button class="eventbtn dq" onclick="setCombo7mResult(${partNo},'miss')">PROMAŠAJ</button>
    </div>`);
}

function setCombo7mResult(partNo,result){
  comboPending[partNo===1?"first":"second"].result=result;
  if(partNo===1)chooseComboSecondActor();
  else saveComboEvents();
}

function comboEventFromPart(part){
  const exactTypes=["2min","dq"];
  const exact=exactTypes.includes(part.type);
  const sec=Number(comboPending.capturedSeconds||0);

  return {
    id:Date.now()+Math.random(),
    seq:nextSeq(),
    team:Number(part.team),
    actorType:"player",
    actor:Number(part.actor),
    type:part.type,
    minute:exact?Math.floor(sec/60):comboMinuteFromSeconds(sec),
    second:exact?(sec%60):null,
    clockSeconds:sec,
    result:part.type==="7m"?(part.result||"miss"):null,
    combo:true
  };
}

function saveComboEvents(){
  const a=comboPending&&comboPending.first;
  const b=comboPending&&comboPending.second;
  if(!a||!b)return;

  const events=[comboEventFromPart(a),comboEventFromPart(b)];

  // Safety checks for sanctions.
  for(const e of events){
    if(e.type==="warning"){
      if(!playerWarningAvailable(e.team,e.actor)){
        const count=teamPlayerWarningCount(e.team);
        alert(count>=3?"Ekipa već ima 3 žuta kartona igračima.":"Ovaj igrač je već dobio žuti karton.");
        return;
      }
    }

    if(e.type==="2min" && !playerSuspensionAvailable(e.team,e.actor,"2min")){
      alert("Igrač može imati najviše 3 isključenja.");
      return;
    }
    if(e.type==="2min"){
      const at=timeToSeconds(e.minute,e.second);
      const active=activeSuspensionEventsForPlayer(e.team,e.actor,at);
      if(active.length){
        alert("Igrač #"+e.actor+" već služi 2 min. Ovaj KOMBO evidentiraj pojedinačno ako je u pitanju rani ulazak.");
        return;
      }
    }
  }

  // Ako KOMBO sadrži dva žuta za istu ekipu, proveri zbir i u okviru samog KOMBO unosa.
  const warningEvents=events.filter(e=>e.type==="warning");
  for(const w of warningEvents){
    const sameTeamInCombo=warningEvents.filter(x=>Number(x.team)===Number(w.team));
    const existing=teamPlayerWarningCount(w.team);
    if(existing+sameTeamInCombo.length>3){
      alert("Ekipa može imati najviše 3 žuta kartona igračima.");
      return;
    }
    const duplicatePlayer=sameTeamInCombo.filter(x=>String(x.actor)===String(w.actor)).length>1;
    if(duplicatePlayer){
      alert("Igrač može imati najviše 1 žuti karton.");
      return;
    }
  }

  state.events.push(...events);
  save();
  comboPending=null;
  closeModal();
  renderAll();
}

function startTopEvent(type){
  pending={team:null,actorType:type==="tto"?"team":"player",actor:type==="tto"?"TEAM":null,type,minute:null,second:null,result:null,topEntry:true};
  const cur=refClockState.active?Math.floor(currentRefSeconds()):0;
  pending.minute=Math.max(1,Math.min(60,Math.floor(cur/60)||1));pending.second=cur%60;
  if(["goal","7m","warning"].includes(type)){chooseTopPlayer();return}
  if(["2min","2plus2","dq","tto"].includes(type)){openPreciseTimeForTop();return}
  chooseMinute();

  const end=["2min","2plus2","additional","dq"].includes(pending.type)?secondsToClock(timeToSeconds(pending.minute,pending.second)+(pending.type==="2plus2"?240:120)):null;
  openModal(`<div class="modalhead"><div class="modaltitle">Potvrdi</div><button class="close" onclick="closeModal()">×</button></div>
  <div class="confirmbox"><strong>${esc(state.teamNames[pending.team])} · ${who}</strong><br><span style="font-size:24px;font-weight:950">${label(pending.type)}</span><br><span style="font-size:22px;font-weight:900">${formatTime(pending)}</span>${pending.type==="7m"?`<br><strong>${pending.result==="goal"?"POGODAK":"PROMAŠAJ"}</strong>`:""}${pending.type==="injury3"?`<br><strong>${Number(pending.attacksDone||0)}/3 NAPADA</strong>`:""}${end?`<br><strong>${pending.type==="additional"?"BEZ BROJA · DOPUNA":auto||pending.type==="dq"?"DOPUNA EKIPE":"POVRATAK"}: ${end}</strong>`:""}</div>
  ${auto?'<div class="autodq">AUTOMATSKA DISKVALIFIKACIJA</div>':''}
  <div class="footer"><button class="btn" onclick="closeModal()">Odustani</button><button class="btn" style="background:#1f6feb;color:#fff" onclick="savePending()">POTVRDI</button></div>`);
}
function nextSeq(){return state.events.length?Math.max(...state.events.map(e=>Number(e.seq||0)))+1:1}
function savePending(){
  if(pending.actorType==="player"&&["goal","7m"].includes(pending.type)){
    const at=timeToSeconds(pending.minute,pending.second);
    if(playerUnavailableForPlayAt(pending.team,pending.actor,at)){
      alert("Isključen ili diskvalifikovan igrač ne može dati gol niti izvoditi 7 m.");
      return;
    }
  }
  if(pending.actorType==="player"&&["2min","2plus2","additional"].includes(pending.type)){
    if(!playerSuspensionAvailable(pending.team,pending.actor,pending.type)){
      alert("Igrač može imati najviše 3 isključenja.");
      return;
    }
  }
  if(pending.actorType==="player"&&pending.type==="warning"){
    if(!playerWarningAvailable(pending.team,pending.actor)){
      const count=teamPlayerWarningCount(pending.team);
      alert(count>=3?"Ekipa već ima 3 žuta kartona.":"Ovaj igrač je već dobio žuti karton.");
      return;
    }
  }
  if(pending.type==="tto"){
    if(!ttoAllowedAtTime(pending.team,pending.minute,pending.second)){
      alert("U poslednjih 5 minuta ekipa može koristiti samo jedan timski tajm-aut.");
      return;
    }
  }
  if(pending.actorType==="official"){
    const o=String(pending.actor).trim().toUpperCase();
    if(pending.type==="dq"){
      if(!officialDQAvailable(pending.team,o)){
        alert("Ovaj zvaničnik je već diskvalifikovan.");
        return;
      }
    }else if(!officialPenaltyAvailable(pending.team,pending.type)){
      alert("Ova vrsta kazne je već iskorišćena za klupu.");
      return;
    }
  }
  if(pending.actorType==="player"&&pending.type==="additional"){
    const at=timeToSeconds(pending.minute,pending.second);
    const active=activeSuspensionEventsForPlayer(pending.team,pending.actor,at);
    if(active.length){
      openModal(`<div class="modalhead"><div class="modaltitle">#${pending.actor}</div><button class="close" onclick="closeModal()">×</button></div>
        <div class="confirmbox"><strong>Igrač već služi 2 min.</strong><br>Ovaj slučaj evidentiraj kao RANI ULAZAK, ne kao ADDITIONAL PLAYER.</div>
        <div class="footer"><button class="btn" onclick="closeModal()">Zatvori</button></div>`);
      return;
    }
  }
  if(pending.actorType==="player"&&pending.type==="2min"&&!pending.overlapChecked){const at=timeToSeconds(pending.minute,pending.second),active=activeSuspensionEventsForPlayer(pending.team,pending.actor,at);if(active.length){pending.overlapChecked=true;openModal(`<div class="modalhead"><div class="modaltitle">#${pending.actor} · prethodno 2 min još traje</div><button class="close" onclick="closeModal()">×</button></div><div class="earlyentry">Da li je ovo kazna zbog ranog ulaska u igru?</div><div class="eventgrid"><button class="eventbtn double" onclick="setEarlyEntry(true)">RANI ULAZAK</button><button class="eventbtn" onclick="setEarlyEntry(false)">DRUGA SITUACIJA</button></div>`);return;}}
  finalizePendingSave();
}
function setEarlyEntry(v){pending.earlyEntry=Boolean(v);finalizePendingSave()}
function finalizePendingSave(){
  const saved={...pending,id:Date.now()+Math.random(),seq:nextSeq()};

  if(!Number.isFinite(Number(saved.clockSeconds))){
    saved.clockSeconds = saved.second!=null
      ? timeToSeconds(saved.minute,saved.second)
      : eventClockSeconds(saved);
  }

  state.events.push(saved);

  if(saved.actorType==="official"){
    const team=Number(saved.team);
    const official=String(saved.actor).trim().toUpperCase();
    if(!Array.isArray(state.officials[team]))state.officials[team]=[];
    if(!state.officials[team].includes(official) && state.officials[team].length<5){
      state.officials[team].push(official);
      state.officials[team].sort((x,y)=>OFFICIALS.indexOf(x)-OFFICIALS.indexOf(y));
    }
  }

  syncReferenceClockFromEvent(saved);
  save();
  pending=null;
  closeModal();
  renderAll();
}
function startTTO(t){
  const count=ttoEvents(t).length;
  if(count>=3){
    alert("Već su evidentirana 3 timska tajm-auta.");
    return;
  }

  pending={team:t,actorType:"team",actor:"TEAM",type:"tto",minute:null,second:null,result:null,ttoNo:count+1};
  chooseMinute();
}
function ttoAllowedAtTime(team,minute,second,excludeId=null){
  const at=timeToSeconds(minute,second);
  if(at<55*60)return true;

  const alreadyInLastFive=state.events.some(e=>
    Number(e.team)===Number(team) &&
    e.type==="tto" &&
    timeToSeconds(e.minute,e.second)>=55*60 &&
    (excludeId==null||String(e.id)!==String(excludeId))
  );

  return !alreadyInLastFive;
}

function undoLast(){
  if(!state.events.length)return;
  const last=[...state.events].sort((a,b)=>(Number(b.seq||0)-Number(a.seq||0)))[0];
  if(confirm("Obrisati poslednji unos?")){state.events=state.events.filter(e=>String(e.id)!==String(last.id));renderAll()}
}
function deleteEvent(id){
  const e=state.events.find(x=>String(x.id)===String(id));
  if(!e)return;

  const actor=e.actorType==="player"
    ?(e.actor==null?"igrač":"#"+e.actor)
    :e.actorType==="official"?"zvaničnik "+e.actor:"ekipa";

  const desc=`${compactEventTime(e)} · ${Number(e.team)===0?"A":"B"} · ${actor} · ${label(e.type)}`;

  if(!confirm(`OBRISATI DOGAĐAJ?\n\n${desc}\n\nBrisanje se ne može poništiti.`))return;

  state.events=state.events.filter(x=>String(x.id)!==String(id));
  selectedEventIds.delete(String(id));
  save();
  renderAll();
}
function toggleEventSelection(id,on){
  id=String(id);
  if(on)selectedEventIds.add(id);else selectedEventIds.delete(id);
  renderLog();
}
function selectAllEvents(){
  selectedEventIds=new Set(state.events.map(e=>String(e.id)));
  renderLog();
}
function clearEventSelection(){
  selectedEventIds.clear();
  renderLog();
}
function deleteSelectedEvents(){
  if(!selectedEventIds.size)return;
  if(!confirm(`Obrisati ${selectedEventIds.size} označenih događaja?`))return;
  state.events=state.events.filter(e=>!selectedEventIds.has(String(e.id)));
  selectedEventIds.clear();
  save();
  renderAll();
}

function deleteAllEvents(){
  if(!state.events.length)return;
  if(!confirm("Obrisati SVE događaje sa utakmice?"))return;
  state.events=[];
  selectedEventIds.clear();
  save();
  renderAll();
}




function openManualEditor(id=null){
  editingEventId=id;
  const existing=id?state.events.find(e=>String(e.id)===String(id)):null;
  const e=existing?{...existing}:{team:0,actorType:"player",actor:(state.players[0][0]||1),type:"goal",minute:1,second:null,result:null};
  openModal(`
    <div class="modalhead"><div class="modaltitle">${existing?"Izmeni događaj":"Dodaj propušten događaj"}</div><button class="close" onclick="closeModal()">×</button></div>
    <div class="manualgrid">
      <div class="field"><label>Ekipa</label><select id="mTeam" onchange="manualRefreshActor()"><option value="0" ${Number(e.team)===0?"selected":""}>A · ${esc(state.teamNames[0])}</option><option value="1" ${Number(e.team)===1?"selected":""}>B · ${esc(state.teamNames[1])}</option></select></div>
      <div class="field"><label>Ko</label><select id="mActorType" onchange="manualRefreshActor();manualRefreshEventOptions()"><option value="player" ${e.actorType==="player"?"selected":""}>Igrač</option><option value="official" ${e.actorType==="official"?"selected":""}>Zvaničnik</option><option value="team" ${e.actorType==="team"?"selected":""}>Ekipa / TTO</option></select></div>
      <div class="field full"><label id="mActorLabel">Broj igrača</label><div id="mActorControl"></div></div>
      <div class="field"><label>Događaj</label><select id="mType" onchange="manualToggleFields()"></select></div>
      <div class="field" id="mResultWrap"><label>7 m</label><select id="mResult"><option value="goal" ${e.result==="goal"?"selected":""}>Pogodak</option><option value="miss" ${e.result==="miss"?"selected":""}>Promašaj</option></select></div>
      <div class="field"><label>Minut</label><input id="mMinute" type="number" inputmode="numeric" min="1" max="60" value="${Number(e.minute)||1}"></div>
      <div class="field" id="mSecondWrap"><label>Sekunde</label><input id="mSecond" type="number" inputmode="numeric" min="0" max="59" value="${e.second==null?0:Number(e.second)}"></div><div class="field" id="mAttacksWrap"><label>Napadi</label><input id="mAttacks" type="number" inputmode="numeric" min="0" max="3" value="${Number(e.attacksDone||0)}"></div>
    </div>
    
    <div class="footer"><button class="btn" onclick="closeModal()">Odustani</button><button class="btn" style="background:#1f6feb;color:#fff" onclick="saveManualEvent()">SAČUVAJ</button></div>`);
  manualRefreshActor(e.actorType==="player"?e.actor:null,e.actorType==="official"?e.actor:null);
  manualRefreshEventOptions(e.type);
  manualToggleFields();
}
function manualRefreshActor(preferredPlayer=null,preferredOfficial=null){
  const team=Number(document.getElementById("mTeam")?.value||0);
  const kind=document.getElementById("mActorType")?.value||"player";
  const wrap=document.getElementById("mActorControl"),labelEl=document.getElementById("mActorLabel");
  if(!wrap)return;
  if(kind==="player"){
    labelEl.textContent="Broj igrača";
    const current=preferredPlayer??(state.players[team][0]||1), roster=[...state.players[team]].sort((a,b)=>a-b);
    wrap.innerHTML=`<input id="mActorPlayer" type="number" inputmode="numeric" min="1" max="99" value="${current}" list="rosterListManual"><datalist id="rosterListManual">${roster.map(n=>`<option value="${n}"></option>`).join("")}</datalist>`;
  }else if(kind==="official"){
    labelEl.textContent="Zvaničnik";
    const list=state.officials[team].length?state.officials[team]:OFFICIALS,current=preferredOfficial??list[0]??"A";
    wrap.innerHTML=`<select id="mActorOfficial">${list.map(o=>`<option value="${o}" ${String(o)===String(current)?"selected":""}>${o}</option>`).join("")}</select>`;
  }else{
    labelEl.textContent="Ekipa";wrap.innerHTML=`<div class="display" style="font-size:18px">${esc(state.teamNames[team])}</div>`;
  }
}
function manualRefreshEventOptions(preferred=null){
  const kind=document.getElementById("mActorType")?.value||"player";
  const sel=document.getElementById("mType");
  if(!sel)return;
  let opts=[];

  if(kind==="player"){
    const team=Number(document.getElementById("mTeam")?.value||0);
    const player=Number(document.getElementById("mActorPlayer")?.value||0);

    opts=[["goal","GOL"],["7m","7 m"]];
    if(playerWarningAvailable(team,player,editingEventId)||preferred==="warning")opts.push(["warning","ŽUTI KARTON"]);

    if(playerSuspensionAvailable(team,player,"2min",editingEventId)||preferred==="2min")opts.push(["2min","2 MIN"]);
    if(playerSuspensionAvailable(team,player,"2plus2",editingEventId)||preferred==="2plus2")opts.push(["2plus2","2+2 MIN"]);

    opts.push(["dq","DISKVALIFIKACIJA"]);

    if(playerSuspensionAvailable(team,player,"additional",editingEventId)||preferred==="additional")opts.push(["additional","ADDITIONAL PLAYER"]);
    opts.push(["injury3","POVREDA 3N"]);
  }else if(kind==="official"){
    const team=Number(document.getElementById("mTeam")?.value||0);
    if(officialPenaltyAvailable(team,"warning",editingEventId)||preferred==="warning")opts.push(["warning","ŽUTI KARTON"]);
    if(officialPenaltyAvailable(team,"2min",editingEventId)||preferred==="2min")opts.push(["2min","2 MIN"]);
    const selectedOfficial=document.getElementById("mActorOfficial")?.value||"A";
    if(officialDQAvailable(team,selectedOfficial,editingEventId)||preferred==="dq")opts.push(["dq","DISKVALIFIKACIJA"]);
  }else{
    opts=[["tto","TIMSKI TAJM-AUT"]];
  }

  sel.innerHTML=opts.map(([v,l])=>`<option value="${v}" ${v===preferred?"selected":""}>${l}</option>`).join("");
  manualToggleFields();
}
function manualToggleFields(){const type=document.getElementById("mType")?.value,r=document.getElementById("mResultWrap"),s=document.getElementById("mSecondWrap"),a=document.getElementById("mAttacksWrap");if(r)r.style.display=type==="7m"?"block":"none";if(s)s.style.display=["2min","2plus2","additional","dq","tto"].includes(type)?"block":"none";if(a)a.style.display=type==="injury3"?"block":"none";}
function saveManualEvent(){
  const team=Number(document.getElementById("mTeam").value),actorType=document.getElementById("mActorType").value,type=document.getElementById("mType").value,minute=Number(document.getElementById("mMinute").value),needsSecond=["2min","2plus2","additional","dq","tto"].includes(type),second=needsSecond?Number(document.getElementById("mSecond").value):null,result=type==="7m"?document.getElementById("mResult").value:null,attacksDone=type==="injury3"?Math.max(0,Math.min(3,Number(document.getElementById("mAttacks")?.value||0))):null;
  if(type==="injury3"&&!editingEventId&&activeInjuryEvents(team).length>=2){alert("Već su evidentirana 2 igrača ove ekipe u obavezi 3 napada.");return}
  if(type==="tto"&&!ttoAllowedAtTime(team,minute,second,editingEventId)){alert("U poslednjih 5 minuta ekipa može koristiti samo jedan timski tajm-aut.");return}
  if(actorType==="player"&&["goal","7m"].includes(type)){
    const playPlayer=Number(document.getElementById("mActorPlayer").value);
    const playAt=timeToSeconds(minute,second);
    if(playerUnavailableForPlayAt(team,playPlayer,playAt,editingEventId)){
      alert("Isključen ili diskvalifikovan igrač ne može dati gol niti izvoditi 7 m.");
      return;
    }
  }
  if(actorType==="player"&&["2min","2plus2","additional"].includes(type)){
    const suspensionPlayer=Number(document.getElementById("mActorPlayer").value);
    if(!playerSuspensionAvailable(team,suspensionPlayer,type,editingEventId)){
      alert("Igrač može imati najviše 3 isključenja.");
      return;
    }
  }
  if(actorType==="player"&&type==="warning"){
    const warningPlayer=Number(document.getElementById("mActorPlayer").value);
    if(!playerWarningAvailable(team,warningPlayer,editingEventId)){
      const count=teamPlayerWarningCount(team,editingEventId);
      alert(count>=3?"Ekipa već ima 3 žuta kartona.":"Ovaj igrač je već dobio žuti karton.");
      return;
    }
  }
  if(actorType==="official"){
    const mo=String(document.getElementById("mActorOfficial").value).trim().toUpperCase();
    if(type==="dq"){
      if(!officialDQAvailable(team,mo,editingEventId)){alert("Ovaj zvaničnik je već diskvalifikovan.");return}
    }else if(!officialPenaltyAvailable(team,type,editingEventId)){
      alert("Ova vrsta kazne je već iskorišćena za klupu.");return
    }
  }
  
  if(!Number.isInteger(minute)||minute<1||minute>60){alert("Minut mora biti od 1 do 60.");return}if(needsSecond&&(!Number.isInteger(second)||second<0||second>59)){alert("Sekunde moraju biti od 00 do 59.");return}
  let actor="TEAM";
  if(actorType==="player"){actor=Number(document.getElementById("mActorPlayer").value);if(!Number.isInteger(actor)||actor<1||actor>99){alert("Broj igrača mora biti od 1 do 99.");return}if(!state.players[team].includes(actor)){if(state.players[team].length>=16){alert("Ekipa već ima 16 igrača.");return}state.players[team].push(actor)}}
  else if(actorType==="official"){actor=document.getElementById("mActorOfficial").value;if(!state.officials[team].includes(actor)){if(state.officials[team].length>=5){alert("Ekipa već ima 5 zvaničnika.");return}state.officials[team].push(actor);state.officials[team].sort((a,b)=>OFFICIALS.indexOf(a)-OFFICIALS.indexOf(b))}}
  let savedEvent=null;
  if(editingEventId){const idx=state.events.findIndex(e=>String(e.id)===String(editingEventId));if(idx<0)return;const old=state.events[idx];savedEvent={...old,team,actorType,actor,type,minute,second,result,attacksDone:type==="injury3"?attacksDone:old.attacksDone,injuryClosed:type==="injury3"?false:old.injuryClosed};state.events[idx]=savedEvent}
  else{savedEvent={id:Date.now()+Math.random(),seq:nextSeq(),team,actorType,actor,type,minute,second,result,attacksDone:type==="injury3"?attacksDone:null,injuryClosed:false};state.events.push(savedEvent)}
  syncReferenceClockFromEvent(savedEvent);
  save();
  editingEventId=null;closeModal();renderAll();
}

function renderSetup(t){
  const el=document.getElementById(t===0?"setupA":"setupB");
  if(!el)return;
  if(!Array.isArray(state.players))state.players=[[],[]];
  if(!Array.isArray(state.players[t]))state.players[t]=[];
  if(!Array.isArray(state.officials))state.officials=[[],[]];
  if(!Array.isArray(state.officials[t]))state.officials[t]=[];
  if(!Array.isArray(state.teamNames))state.teamNames=["Ekipa A","Ekipa B"];
  if(!Array.isArray(state.teamColors))state.teamColors=["#1565C0","#D32F2F"];
  const pc=state.players[t].length,oc=state.officials[t].length,color=state.teamColors[t]||TEAM_COLOR_PRESETS[t]||"#1565C0",soft=isBlackTeamColor(color)?"rgba(17,24,39,.08)":hexToRgba(color,.32);

  el.style.setProperty("--setupTeam",color);
  el.style.setProperty("--setupSoft",soft);

  el.innerHTML=`
    <div class="setupTeamTitle">Ekipa ${t===0?"A":"B"}</div>
    <div class="setupMetrics">
      <span class="setupMetric">IGRAČI ${pc}/16</span>
      <span class="setupMetric">ZVANIČNICI ${oc}/5</span>
    </div>

    <div class="setupSection">Ime kluba</div>
    <input class="setupName" type="text" maxlength="40"
      value="${esc(state.teamNames[t])}"
      oninput="state.teamNames[${t}]=this.value||'Ekipa ${t===0?"A":"B"}';save();renderScore()">

    <div class="setupSection">Boja ekipe</div>
    <div class="setupColors">
      ${TEAM_COLOR_PRESETS.map(c=>`<button type="button" class="setupColor ${c.toLowerCase()===String(color).toLowerCase()?"on":""}" style="background:${c}" onclick="setTeamColor(${t},'${c}')"></button>`).join("")}
    </div>

    <div class="setupSection">Igrači · broj 1–99</div>
    <div class="setupPlayers">
      <div>
        <div class="setupDisplay">${buf[t]||"—"}</div>
        <div class="setupKeypad">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="setupKey" onclick="kp(${t},'${n}')">${n}</button>`).join("")}
          <button type="button" class="setupKey" onclick="kc(${t})">C</button>
          <button type="button" class="setupKey" onclick="kp(${t},'0')">0</button>
          <button type="button" class="setupKey" onclick="addP(${t})">＋</button>
        </div>
      </div>
      <div class="setupRoster">
        ${[...state.players[t]].sort((a,b)=>a-b).map(n=>`<span class="setupPlayerTag">${n}<button type="button" onclick="delP(${t},${n})">×</button></span>`).join("")}
      </div>
    </div>

    <div class="setupSection">Zvaničnici A–F · izabrano ${oc}/5</div>
    <div class="setupOfficials">
      ${OFFICIALS.map(o=>`<button type="button" class="setupOfficial ${state.officials[t].includes(o)?"on":""}" onclick="toggleO(${t},'${o}')">${o}</button>`).join("")}
    </div>`;
}

function finishSetup(){
  save();
  renderAll();
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById("match").classList.add("active");
  document.querySelectorAll(".tabs .btn").forEach(x=>x.classList.remove("active"));
  const first=document.querySelector(".tabs .btn");
  if(first)first.classList.add("active");
}

function kp(t,d){if(buf[t].length<2){buf[t]=(buf[t]+d).replace(/^0+/,"");renderSetup(t)}}
function kc(t){buf[t]="";renderSetup(t)}
function addP(t){const n=parseInt(buf[t],10);if(!n||n<1||n>99)return alert("Broj mora biti 1–99.");if(!state.players[t].includes(n)){if(state.players[t].length>=16)return alert("Maksimalno 16 igrača.");state.players[t].push(n)}buf[t]="";renderAll()}
function delP(t,n){state.players[t]=state.players[t].filter(x=>x!==n);renderAll()}
function toggleO(t,o){let a=state.officials[t];if(a.includes(o))state.officials[t]=a.filter(x=>x!==o);else{if(a.length>=5)return alert("Najviše 5 zvaničnika.");state.officials[t]=[...a,o].sort((a,b)=>OFFICIALS.indexOf(a)-OFFICIALS.indexOf(b))}save();renderAll()}

renderAll();
</script>
