var BACKUP_KEY=STORAGE_KEY+"-rolling-backups-v149";

function save(){
  try{
    if(!window.localStorage)return;
    const next=JSON.stringify(state);
    const previous=localStorage.getItem(STORAGE_KEY);
    if(previous && previous!==next){
      let backups=[];
      try{backups=JSON.parse(localStorage.getItem(BACKUP_KEY)||"[]")}catch(e){backups=[]}
      if(!Array.isArray(backups))backups=[];
      if(!backups.length || backups[0].state!==previous){
        backups.unshift({at:Date.now(),state:previous});
        backups=backups.slice(0,10);
        localStorage.setItem(BACKUP_KEY,JSON.stringify(backups));
      }
    }
    localStorage.setItem(STORAGE_KEY,next);
  }catch(e){console.error("save",e)}
}

function shortEventType(e){
  if(!e)return "";
  if(e.type==="goal")return "GOL";
  if(e.type==="warning")return "Ž";
  if(e.type==="2min")return "2 MIN";
  if(e.type==="2plus2")return "2+2";
  if(e.type==="dq")return "DK";
  if(e.type==="additional")return "ADD";
  if(e.type==="injury3")return "POVR 3N";
  if(e.type==="tto")return "TTO";
  if(e.type==="7m")return `7m ${e.result==="goal"?"G":e.result==="miss"?"X":""}`.trim();
  return label(e.type);
}

function breakPenaltyType(type){
  return ["warning","2min","2plus2","dq"].includes(String(type||""));
}

function liveEventBlockedDuringBreak(type,showMessage=true){
  if(!breakTimerState.active)return false;
  if(breakPenaltyType(type))return false;
  if(showMessage){
    showRecordToastText("POLUVREME · DOZVOLJENE SU SAMO KAZNE","#b42318");
  }
  return true;
}

function prepareBreakPenaltyPending(target){
  if(!target)return target;
  target.minute=30;
  target.second=0;
  target.clockSeconds=30*60;
  target.capturedSeconds=30*60;
  target.timePrecision="break";
  target.duringBreak=true;
  target.clockWasRunning=false;
  return target;
}

function refreshBreakLockedControls(){
  try{renderTeam(0)}catch(e){}

function captureOperationalSeconds(){
  const v=refClockState.active?Math.floor(currentRefSeconds()):currentGameSecond();
  return Math.max(0,Math.min(3600,Number(v)||0));
}

function applyMinuteOnlySnapshot(target,seconds=null){
  const sec=seconds==null?captureOperationalSeconds():Math.max(0,Math.min(3600,Number(seconds)||0));
  target.capturedSeconds=sec;
  target.clockSeconds=sec;
  target.minute=displayMinuteFromClockSeconds(sec); // 17:42 = 18. minut
  target.second=null;
  target.timePrecision="minute";
  return target;
}

function seedExactSnapshot(target,seconds=null){
  const sec=seconds==null?captureOperationalSeconds():Math.max(0,Math.min(3600,Number(seconds)||0));
  target.capturedSeconds=sec;
  target.hybridMinute=Math.min(60,Math.floor(sec/60));
  target.minute=target.hybridMinute;
  target.second=null;
  target.clockSeconds=null;
  target.timePrecision="exact";
  target.clockWasRunning=refClockState.active?Boolean(refClockState.running):true;
  return target;
}

function openHybridExactTimePicker(){
  if(!pending)return;
  const captured=Math.max(0,Math.min(3600,Number(pending.capturedSeconds??captureOperationalSeconds())||0));
  if(!Number.isInteger(Number(pending.hybridMinute)))pending.hybridMinute=Math.min(60,Math.floor(captured/60));
  const m=Math.max(0,Math.min(60,Number(pending.hybridMinute)||0));
  const suggestedSec=m===60?0:(captured%60);
  const minuteChoices=[m-1,m,m+1].filter((x,i,a)=>x>=0&&x<=60&&a.indexOf(x)===i);
  const minuteBtns=minuteChoices.map(x=>`<button class="hybridMinuteBtn ${x===m?'active':''}" onclick="selectHybridMinute(${x})">${String(x).padStart(2,'0')}</button>`).join('');
  const seconds=m===60
    ?`<button class="timebtn hybridSecond suggested" onclick="setHybridSecond(0)">00</button>`
    :Array.from({length:60},(_,i)=>i).map(s=>`<button class="timebtn hybridSecond ${s===suggestedSec?'suggested':''}" onclick="setHybridSecond(${s})">${String(s).padStart(2,'0')}</button>`).join('');
  openModal(`<div class="modalhead"><div class="modaltitle">${label(pending.type)} · VREME SA SEMAFORA</div><button class="close" onclick="closeModal()">×</button></div>
    <div class="hybridCaptured">Pomoćni sat pri prvom kliku: <strong>${secondsToClock(captured)}</strong></div>
    <div class="hybridMinuteLabel">MINUT NA SEMAFORU</div>
    <div class="hybridMinuteRow">${minuteBtns}</div>
    <div class="hybridSecondLabel">SEKUNDE · jedan dodir završava unos</div>
    <div class="timegrid secondFocusGrid hybridSeconds">${seconds}</div>
    <button class="hybridOtherMinute" onclick="chooseExactMinute()">DRUGI MINUT</button>`);
}

function selectHybridMinute(m){
  if(!pending)return;
  pending.hybridMinute=Math.max(0,Math.min(60,Number(m)||0));
  pending.minute=pending.hybridMinute;
  openHybridExactTimePicker();
}

function setHybridSecond(s){
  if(!pending)return;
  const m=Math.max(0,Math.min(60,Number(pending.hybridMinute??pending.minute)||0));
  const sec=m===60?0:Math.max(0,Math.min(59,Number(s)||0));
  pending.minute=m;
  pending.second=sec;
  pending.clockSeconds=Math.min(3600,timeToSeconds(m,sec));
  pending.timePrecision="exact";
  // Korisnik je potvrdio tačno vreme. Za sve osim TTO sat nastavlja od tog vremena.
  setReferenceClock(pending.clockSeconds,label(pending.type)+" · tačno vreme",pending.type!=="tto");
  finishPendingTimeSelection();
}

// Fallback stari izbor minuta i sekunde i dalje radi, ali tačno vreme uvek sinhronizuje sat.
function runClockFromPendingTime(){
  if(!pending||pending.minute==null)return;
  if(pending.second==null)return; // minutni događaji NE koriguju sat
  const sec=Math.min(3600,timeToSeconds(pending.minute,pending.second));
  pending.clockSeconds=sec;
  pending.timePrecision="exact";
  setReferenceClock(sec,label(pending.type)+" · tačno vreme",pending.type!=="tto");
}

function chooseEvent(type){
  if(!pending)return;
  pending.type=type;
  pending.minute=null;pending.second=null;pending.clockSeconds=null;

  if(breakTimerState.active){
    if(!breakPenaltyType(type)){
      liveEventBlockedDuringBreak(type);
      return;
    }
    prepareBreakPenaltyPending(pending);
    savePending();
    return;
  }

  if(type==="injury3"){
    applyMinuteOnlySnapshot(pending);
    chooseInjuryPossession();
    return;
  }
  if(["goal","warning","7m"].includes(type)){
    applyMinuteOnlySnapshot(pending);
    if(type==="7m"){choose7m();return}
    savePending();
    return;
  }
  if(["2min","2plus2","additional","dq","tto"].includes(type)){
    seedExactSnapshot(pending);
    openHybridExactTimePicker();
    return;
  }
}

  pending={team:null,actorType:type==="tto"?"team":"player",actor:type==="tto"?"TEAM":null,type,minute:null,second:null,clockSeconds:null,result:null,topEntry:true};
  if(breakTimerState.active && breakPenaltyType(type)){
    prepareBreakPenaltyPending(pending);
    afterTopTimeChosen();
    return;
  }
  if(["goal","7m","warning"].includes(type)){
    applyMinuteOnlySnapshot(pending);
    afterTopTimeChosen();
    return;
  }
  if(["2min","2plus2","additional","dq","tto"].includes(type)){
    seedExactSnapshot(pending);
    openHybridExactTimePicker();
    return;
  }
  applyMinuteOnlySnapshot(pending);
  afterTopTimeChosen();
}

function chooseTopPlayer(){

  const rosterA=[...(state.players[0]||[])].sort((a,b)=>a-b).filter(n=>!playableOnly||!playerUnavailableForPlayAt(0,n,at));
  const rosterB=[...(state.players[1]||[])].sort((a,b)=>a-b).filter(n=>!playableOnly||!playerUnavailableForPlayAt(1,n,at));
  const teamBlock=(t,roster)=>`<div class="pickTeamBox" style="--pick:${state.teamColors[t]}"><div class="pickTeamTitle">${t===0?"A":"B"} · ${esc(state.teamNames[t])}</div><div class="playerPickGrid">${roster.length?roster.map(n=>`<button class="playerPickBtn" style="--team:${state.teamColors[t]}" onclick="setTopPlayer(${t},${n})">${n}</button>`).join(""):'<div class="noPlayable">NEMA DOSTUPNIH IGRAČA</div>'}</div></div>`;
  openModal(`<div class="modalhead"><div class="modaltitle">${label(pending.type)} · ${compactEventTime(pending)} · izaberi igrača</div><button class="close" onclick="closeModal()">×</button></div><div class="pickTeams">${teamBlock(0,rosterA)}${teamBlock(1,rosterB)}</div>${pending.type==="7m"?'<button class="defer7m" onclick="saveTop7mUnresolved()">7 m · DODAJ IZVOĐAČA KASNIJE</button>':""}`);
}

function saveTop7m(result){
  pending.result=result;
  if(Number.isFinite(Number(pending.clockSeconds))){
    pending.minute=displayMinuteFromClockSeconds(pending.clockSeconds);
    pending.second=null;
    pending.timePrecision="minute";
  }
  pending.topEntry=false;
  savePending();
}

function startTeamEvent(t,type){
  const team=Number(t);
  if(liveEventBlockedDuringBreak(type))return;
  if(type==="injury3"&&activeInjuryEvents(team).length>=2){alert("Već su evidentirana 2 igrača ove ekipe u obavezi 3 napada.");return}
  if(armedTeamEvent&&Number(armedTeamEvent.team)===team&&armedTeamEvent.type===type){armedTeamEvent=null;showRecordToastText("IZBOR DOGAĐAJA OTKAZAN");renderAll();return}
  armedTeamEvent={team,type,capturedSeconds:captureOperationalSeconds()};
  showRecordToastText(`${label(type)} · DODIRNI BROJ IGRAČA`,state.teamColors?.[team]||null);
  renderAll();
}

function selectArmedTeamEventPlayer(t,n,type){
  const team=Number(t),player=Number(n);
  const captured=Number(armedTeamEvent?.capturedSeconds??captureOperationalSeconds());
  pending={team,actorType:"player",actor:player,type,minute:null,second:null,clockSeconds:null,result:null,attacksDone:type==="injury3"?0:null,injuryClosed:type==="injury3"?false:null,hasBall:null,possession:null,topEntry:false,quickEntry:true};
  armedTeamEvent=null;renderAll();

  if(breakTimerState.active && breakPenaltyType(type)){
    prepareBreakPenaltyPending(pending);
    savePending();
    return;
  }

  if(type==="7m"){
    applyMinuteOnlySnapshot(pending,captured);
    choose7m();return;
  }
  if(type==="injury3"){
    applyMinuteOnlySnapshot(pending,captured);
    chooseTeamInjuryPossession();return;
  }
  seedExactSnapshot(pending,captured);
  openHybridExactTimePicker();
}

function setTeamEventPlayer(t,n,type){
  pending=makePending(Number(t),"player",Number(n),type,true);
  if(type==="7m"){
    applyMinuteOnlySnapshot(pending);
    choose7m();return;
  }
  if(type==="injury3"){
    applyMinuteOnlySnapshot(pending);
    chooseTeamInjuryPossession();return;
  }
  seedExactSnapshot(pending);
  openHybridExactTimePicker();
}

function startTeamInjury(t){
  const team=Number(t);
  if(liveEventBlockedDuringBreak("injury3"))return;
  if(activeInjuryEvents(team).length>=2){alert("Već su evidentirana 2 igrača ove ekipe u obavezi 3 napada.");return}
  pending={team,actorType:"player",actor:null,type:"injury3",minute:null,second:null,clockSeconds:null,result:null,attacksDone:0,injuryClosed:false,hasBall:null,possession:null,topEntry:false,quickEntry:true};
  applyMinuteOnlySnapshot(pending);
  chooseTeamInjuryPossession();
}

function setInjuryPossession(hasBall){
  if(!pending)return;
  pending.attacksDone=hasBall?1:0;
  pending.hasBall=!!hasBall;
  pending.possession=!!hasBall;
  if(!Number.isFinite(Number(pending.clockSeconds)))applyMinuteOnlySnapshot(pending);
  savePending();
}

function startCenterInjury(){
  if(liveEventBlockedDuringBreak("injury3"))return;
  const captured=captureOperationalSeconds();
  injuryCenterPending={clockSeconds:captured,minute:displayMinuteFromClockSeconds(captured),second:null,timePrecision:"minute",team:null,hasBall:null};
  openModal(`<div class="modalhead"><div class="modaltitle">3 NAPADA · izaberi ekipu</div><button class="close" onclick="injuryCenterPending=null;closeModal()">×</button></div><div class="eventgrid"><button class="eventbtn" onclick="centerInjuryTeam(0)">A · ${esc(state.teamNames[0])}</button><button class="eventbtn" onclick="centerInjuryTeam(1)">B · ${esc(state.teamNames[1])}</button></div><div class="confirmbox">Vreme prvog klika je sačuvano kao redni minut događaja.</div>`);
}

function finishCenterInjury(player){
  if(!injuryCenterPending)return;
  const p=injuryCenterPending;
  if(hasOtherActiveInjuryForPlayer(Number(p.team),Number(player))){
    alert("Isti igrač već ima aktivnu obavezu 3 napada.");
    return;
  }
  const event={id:Date.now()+Math.random(),seq:nextSeq(),team:Number(p.team),actorType:"player",actor:Number(player),type:"injury3",minute:Number(p.minute),second:null,clockSeconds:Number(p.clockSeconds),timePrecision:"minute",result:null,attacksDone:0,injuryClosed:false,hasBall:!!p.hasBall,possession:!!p.hasBall,quickEntry:true};
  state.events.push(event);lastUndoneEvent=null;injuryCenterPending=null;save();closeModal();renderAll();
}

function startTTO(t){
  if(liveEventBlockedDuringBreak("tto"))return;
  const team=Number(t);
  const captured=captureOperationalSeconds();
  const restriction=ttoRestrictionAtSeconds(team,captured);
  if(restriction){alert(restriction);return}
  const count=ttoEvents(team).length;
  pending={team,actorType:"team",actor:"TEAM",type:"tto",minute:null,second:null,clockSeconds:null,result:null,ttoNo:count+1,topEntry:false};
  seedExactSnapshot(pending,captured);
  openHybridExactTimePicker();
}

function eventHasExactTime(e){
  return !!e && (e.timePrecision==="exact" || e.second!=null);
}

function undoLast(){
  if(!state.events.length)return;
  const last=[...state.events].sort((a,b)=>Number(b.seq||0)-Number(a.seq||0))[0];
  const actor=last.actorType==="player"?("#"+last.actor):last.actorType==="official"?("Zv."+last.actor):"TTO";
  if(!confirm(`Obrisati poslednji unos?\n\n${compactEventTime(last)} · ${Number(last.team)===0?"A":"B"} · ${actor} · ${shortEventType(last)}`))return;
  lastUndoneEvent=JSON.parse(JSON.stringify(last));
  state.events=state.events.filter(e=>String(e.id)!==String(last.id));
  selectedEventIds.delete(String(last.id));
  if(String(clockLinkedEventId||"")===String(last.id))clockLinkedEventId=null;
  if(eventHasExactTime(last)){
    // Poslednja potvrđena tačka vremena ostaje na satu i sat je STOP.
    setReferenceClock(eventClockSeconds(last),"UNDO · vreme obrisanog događaja",false);
  }
  save();renderAll();
}

function repeatUndoneEvent(){
  if(!lastUndoneEvent)return;
  const u=JSON.parse(JSON.stringify(lastUndoneEvent));
  pending={...u,id:undefined,seq:undefined,overlapChecked:false,earlyEntry:false,topEntry:false,quickEntry:true};
  if(eventHasExactTime(u)){
    // UNDO je već zaustavio sat na starom tačnom vremenu; to je početni predlog.
    const seed=refClockState.active?Math.floor(currentRefSeconds()):eventClockSeconds(u);
    seedExactSnapshot(pending,seed);
    openHybridExactTimePicker();
    return;
  }
  applyMinuteOnlySnapshot(pending);
  if(pending.type==="7m" && pending.result==null){choose7m();return}
  savePending();
}

function dismissUndoneEvent(){lastUndoneEvent=null;renderCenterEvents()}

function openToolsMenu(){
  openModal(`<div class="modalhead"><div class="modaltitle">ALATI</div><button class="close" onclick="closeModal()">×</button></div>
    <div class="toolsMenuGrid">
      <button class="toolsMenuBtn" onclick="closeModal();renderSetup(0);renderSetup(1);showScreen('setup',null)">POSTAVKA</button>
      <button class="toolsMenuBtn" onclick="openBackupRecovery()">REZERVNE KOPIJE</button>
      <button class="toolsMenuBtn dangerTool" onclick="closeModal();resetWholeMatch()">NOVA UTAKMICA</button>
    </div>`);
}

function getRollingBackups(){
  try{const x=JSON.parse(localStorage.getItem(BACKUP_KEY)||"[]");return Array.isArray(x)?x:[]}catch(e){return []}
}
function openBackupRecovery(){
  const arr=getRollingBackups();
  const rows=arr.slice(0,8).map((b,i)=>{
    const d=new Date(Number(b.at)||Date.now());
    return `<button class="backupRow" onclick="restoreRollingBackup(${i})"><strong>${d.toLocaleTimeString('sr-RS',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</strong><span>Vrati ovo stanje</span></button>`;
  }).join('');
  openModal(`<div class="modalhead"><div class="modaltitle">REZERVNE KOPIJE</div><button class="close" onclick="closeModal()">×</button></div>${rows||'<div class="confirmbox">Još nema rezervnih kopija.</div>'}<div class="footer"><button class="btn" onclick="openToolsMenu()">NAZAD</button></div>`);
}
function restoreRollingBackup(index){
  const arr=getRollingBackups();const item=arr[Number(index)];if(!item)return;
  if(!confirm("Vratiti izabrano prethodno stanje utakmice?"))return;
  try{state=JSON.parse(item.state);normalizeState();lastUndoneEvent=null;save();closeModal();restoreClockFromLastRecordedEvent();renderAll()}catch(e){alert("Rezervna kopija nije mogla da se učita.")}
}


restoreClockFromLastRecordedEvent();
renderAll();
</script>
</body>
</html>
